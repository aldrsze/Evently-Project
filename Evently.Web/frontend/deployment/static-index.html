<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Evently · Philippine Event Discovery</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        background: #f7f6fc;
        color: #1d2333;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 620px);
        padding: 40px;
        border: 1px solid #e9e6f2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 60px #27204412;
      }
      .brand {
        color: #7657f6;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 16px 0 10px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        letter-spacing: -0.055em;
      }
      p {
        color: #697184;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 12px;
        padding: 12px 18px;
        border-radius: 12px;
        background: #7657f6;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 24px;
        color: #8991a1;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">evently.</span>
      <h1>Discover experiences. Create memories.</h1>
      <p>
        This static build carries Evently’s frontend assets. The complete demo
        is rendered by the ASP.NET Core MVC application.
      </p>
      <a href="/">Open the Evently demo</a>
      <small
        >Philippine sample listings · demo only · no live tickets or
        payments</small
      >
    </main>
  </body>
</html>
